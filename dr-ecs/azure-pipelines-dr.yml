# =============================================================================
# lab-py39 — DR pipeline: Azure App Service (Southeast Asia) -> AWS ECS Fargate (ap-southeast-7)
#
# SEPARATE from the DC pipeline (/azure-pipelines.yml). It never deploys to, reads from or
# changes Azure. It only needs: this Git repo, Azure DevOps, and AWS Thailand.
#
#   action = build-only    build image from this commit -> ECR, sync config + secrets -> SSM
#            deploy-dr     build-only + roll ECS to the new image, watch health for N minutes,
#                          then scale back to 0 (rehearsal). If DR is ACTIVE, keeps it running.
#            activate-dr   build-only + roll ECS and KEEP it running  (approval: drlab-ecs-activate)
#            deactivate-dr scale the ECS service to 0, mark standby  (no build)
#
#   imageTag = auto        image for this commit + current golden base: git-<sha12>-b<base digest 8>;
#                          built only if not already in ECR (a new base or a new commit = a new image)
#              last-good   the last image that passed a DR health watch (SSM meta/last-good)
#              <tag>       any existing ECR tag (e.g. roll back)
#
# Base image = the private golden copy in ECR (SSM /drlab-ecs/base/<baseImageKey>, filled by
# the "Base image mirror" pipeline, repo drlab-platform). No public registry is contacted during a DR build.
# Runs on Microsoft-hosted ubuntu-latest (needs Docker). AWS access = AWS Toolkit service
# connection with OIDC (no stored keys) -> role drlab-ecs-ado-deployer-ap-southeast-7.
# =============================================================================
name: dr-$(Date:yyyyMMdd)$(Rev:.r)
 
trigger:                       # every DC code change also refreshes the DR image (rehearsal)
  branches: { include: [ main ] }
pr: none
schedules:
  - cron: '0 19 * * *'         # 02:00 ICT nightly rehearsal (defaults: deploy-dr, auto)
    displayName: Nightly DR rehearsal
    branches: { include: [ main ] }
    always: true
 
parameters:
  - name: action
    displayName: DR action
    type: string
    default: deploy-dr
    values: [ build-only, deploy-dr, activate-dr, deactivate-dr ]
  - name: imageTag
    displayName: 'Image: auto | last-good | explicit ECR tag'
    type: string
    default: auto
  - name: desiredCount
    displayName: Tasks to run (deploy/activate)
    type: number
    default: 1
  - name: healthMinutes
    displayName: Health watch after rollout (minutes)
    type: number
    default: 5
 
variables:
  appId: lab-py39
  containerName: app                   # container name in the task definition (console step 4.2)
  containerPort: '8000'                # App Service Python default PORT
  albPath: /py39/
  awsRegion: ap-southeast-7
  awsConnection: sc-aws-drlab-ecs      # AWS Toolkit service connection (OIDC)
  ecsCluster: drlab-ecs
  ecsService: lab-py39
  ssmApp: /drlab-ecs/lab-py39        # config/*, secret/*, meta/*
  ssmInfra: /drlab-ecs/infra           # written by CloudFormation, read-only here
  baseImageKey: python39                 # SSM /drlab-ecs/base/<key> = pinned private base image
  secretGroup: drlab-ecs-lab-py39-secrets
  secretNames: DB_PASSWORD API_KEY     # must match the variable group AND the env: map below
  ${{ if eq(parameters.action, 'activate-dr') }}:
    drEnvironment: drlab-ecs-activate  # approval check
  ${{ else }}:
    drEnvironment: drlab-ecs-rehearsal # no check
 
pool:
  vmImage: ubuntu-latest
 
stages:
# -----------------------------------------------------------------------------
- stage: Prepare
  displayName: Image + config/secrets -> AWS
  condition: ne('${{ parameters.action }}', 'deactivate-dr')
  variables:
    - group: ${{ variables.secretGroup }}
  jobs:
  - job: prep
    steps:
    - checkout: self
      clean: true
      fetchDepth: 1
 
    - task: AWSShellScript@1
      name: resolve
      displayName: Resolve image tag (build only if missing in ECR)
      inputs:
        awsCredentials: $(awsConnection)
        regionName: $(awsRegion)
        scriptType: inline
        inlineScript: |
          set -euo pipefail
          REPO_URI=$(aws ssm get-parameter --name "$(ssmInfra)/$(appId)/ecr-uri" --query Parameter.Value --output text)
          REPO_NAME="${REPO_URI#*/}"
          BASE=$(aws ssm get-parameter --name "/drlab-ecs/base/$(baseImageKey)" --query Parameter.Value --output text 2>/dev/null) \
            || { echo "##vso[task.logissue type=error]No golden base /drlab-ecs/base/$(baseImageKey) - run the Base image mirror pipeline first"; exit 1; }
          BASE_DIGEST="${BASE##*@sha256:}"
          echo "Golden base: $BASE"
          case "$TAG_PARAM" in
            auto)      TAG="git-${BUILD_SOURCEVERSION:0:12}-b${BASE_DIGEST:0:8}" ;;
            last-good) TAG=$(aws ssm get-parameter --name "$(ssmApp)/meta/last-good" --query Parameter.Value --output text) ;;
            *)         TAG="$TAG_PARAM" ;;
          esac
          if aws ecr describe-images --repository-name "$REPO_NAME" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            NEED_BUILD=false; echo "Image $TAG already in ECR - no build"
          elif [ "$TAG_PARAM" = auto ]; then
            NEED_BUILD=true;  echo "Image $TAG not in ECR - will build"
          else
            echo "##vso[task.logissue type=error]Tag '$TAG' not found in $REPO_NAME"; exit 1
          fi
          if [ "$NEED_BUILD" = true ]; then     # login now: docker build pulls the base from private ECR
            aws ecr get-login-password | docker login --username AWS --password-stdin "${REPO_URI%%/*}"
          fi
          echo "##vso[task.setvariable variable=baseImage]$BASE"
          echo "##vso[task.setvariable variable=needBuild]$NEED_BUILD"
          echo "##vso[task.setvariable variable=imageUri]$REPO_URI:$TAG"
          echo "##vso[task.setvariable variable=imageUri;isOutput=true]$REPO_URI:$TAG"
      env:
        TAG_PARAM: ${{ parameters.imageTag }}
 
    # Build context = `git archive HEAD` = exactly the tracked files the DC pipeline zips for
    # App Service (no .git, .env, .venv). The Dockerfile then does what Oryx does there.
    - bash: |
        set -euo pipefail
        CTX="$(Agent.TempDirectory)/ctx"; rm -rf "$CTX"; mkdir -p "$CTX"
        git archive --format=tar HEAD | tar -x -C "$CTX"
        echo "Build context (tracked files):"; (cd "$CTX" && find . -type f | sort)
        docker build --pull --platform linux/amd64 \
          --build-arg BASE_IMAGE="$(baseImage)" \
          --label org.opencontainers.image.base.name="$(baseImage)" \
          --label org.opencontainers.image.revision=$(Build.SourceVersion) \
          --label org.opencontainers.image.source=$(Build.Repository.Uri) \
          --label drlab.ado.build=$(Build.BuildNumber) \
          -t "$(imageUri)" "$CTX"
        docker image ls "$(imageUri)"
 
        echo "== smoke test on the agent (fake values, no AWS)"
        cid=$(docker run -d -p 18080:$(containerPort) -e PORT=$(containerPort) \
              -e APP_ENV=ci -e DB_PASSWORD=ci-fake -e API_KEY=ci-fake "$(imageUri)")
        ok=false
        for i in $(seq 1 20); do
          if curl -fsS --max-time 3 http://127.0.0.1:18080/health; then ok=true; echo; break; fi
          sleep 2
        done
        docker logs "$cid" | tail -20; docker rm -f "$cid" >/dev/null
        $ok || { echo "##vso[task.logissue type=error]Image failed the local /health smoke test"; exit 1; }
      displayName: docker build + local smoke test
      condition: and(succeeded(), eq(variables['needBuild'], 'true'))
 
    - task: AWSShellScript@1
      displayName: Push image to ECR
      condition: and(succeeded(), eq(variables['needBuild'], 'true'))
      inputs:
        awsCredentials: $(awsConnection)
        regionName: $(awsRegion)
        scriptType: inline
        inlineScript: |
          set -euo pipefail
          REGISTRY="${IMAGE_URI%%/*}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker push "$IMAGE_URI"
          aws ssm put-parameter --name "$(ssmApp)/meta/last-built" --type String --overwrite --value "${IMAGE_URI##*:}" >/dev/null
      env:
        IMAGE_URI: $(imageUri)
 
    # Config  : dr-ecs/config.env  (KEY=VALUE, committed)  -> SSM String      <ssmApp>/config/<KEY>
    # Secrets : ADO variable group (locked, secret)        -> SSM SecureString <ssmApp>/secret/<KEY>
    # Only changed values are written (keeps SSM history clean). Removed config keys are deleted.
    - task: AWSShellScript@1
      displayName: Sync config + secrets -> SSM Parameter Store
      inputs:
        awsCredentials: $(awsConnection)
        regionName: $(awsRegion)
        scriptType: inline
        inlineScript: |
          set -euo pipefail
          put_if_changed() {   # type name value   (never prints a value)
            local type="$1" name="$2" val="$3" cur tmp
            cur=$(aws ssm get-parameter --name "$name" --with-decryption --query Parameter.Value --output text 2>/dev/null) || cur=$'\x01none'
            if [ "$cur" == "$val" ]; then echo "   = ${name##*/}"; return; fi
            tmp=$(mktemp); printf '%s' "$val" > "$tmp"
            aws ssm put-parameter --name "$name" --type "$type" --value "file://$tmp" --overwrite >/dev/null
            rm -f "$tmp"; echo "   ~ ${name##*/} ($type) updated"
          }
 
          echo "== config (dr-ecs/config.env)"
          declare -A WANT=()
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"
            [[ -z "${line// }" || "$line" =~ ^[[:space:]]*# ]] && continue
            k="${line%%=*}"; v="${line#*=}"
            [[ "$k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || { echo "##vso[task.logissue type=error]Bad key '$k'"; exit 1; }
            [ -n "$v" ] || { echo "##vso[task.logissue type=warning]$k is empty - SSM cannot store empty values, skipped"; continue; }
            WANT[$k]=1
            put_if_changed String "$(ssmApp)/config/$k" "$v"
          done < dr-ecs/config.env
          for n in $(aws ssm get-parameters-by-path --path "$(ssmApp)/config" --query 'Parameters[].Name' --output text); do
            [ -n "${WANT[${n##*/}]:-}" ] || { aws ssm delete-parameter --name "$n"; echo "   - ${n##*/} removed"; }
          done
 
          echo "== secrets (variable group $(secretGroup))"
          for k in $(secretNames); do
            var="DR_$k"; v="${!var:-}"
            if [ -z "$v" ] || [ "$v" = "\$($k)" ]; then
              echo "##vso[task.logissue type=error]Secret $k missing in variable group $(secretGroup) (or not mapped in env:)"; exit 1
            fi
            put_if_changed SecureString "$(ssmApp)/secret/$k" "$v"
          done
      env:
        # Secret variables reach a script only when mapped explicitly.
        # Never name these SECRET_* (the task library swallows SECRET_* env vars).
        DR_DB_PASSWORD: $(DB_PASSWORD)
        DR_API_KEY: $(API_KEY)
 
# -----------------------------------------------------------------------------
- stage: Deploy
  displayName: Roll ECS + health watch
  dependsOn: Prepare
  condition: and(succeeded(), in('${{ parameters.action }}', 'deploy-dr', 'activate-dr'))
  jobs:
  - deployment: ecs
    environment: ${{ variables.drEnvironment }}
    variables:
      imageUri: $[ stageDependencies.Prepare.prep.outputs['resolve.imageUri'] ]
    strategy:
      runOnce:
        deploy:
          steps:
          - download: none
          - task: AWSShellScript@1
            displayName: Register task definition, update service, watch health
            inputs:
              awsCredentials: $(awsConnection)
              regionName: $(awsRegion)
              scriptType: inline
              inlineScript: |
                set -euo pipefail
                C=$(ecsCluster); S=$(ecsService); APP=$(ssmApp)
                MODE=$(aws ssm get-parameter --name "$APP/meta/mode" --query Parameter.Value --output text 2>/dev/null || echo standby)
                CUR_DESIRED=$(aws ecs describe-services --cluster "$C" --services "$S" --query 'services[0].desiredCount' --output text)
                if [ "$ACTION" = deploy-dr ] && [ "$MODE" = active ]; then
                  COUNT=$(( CUR_DESIRED > 0 ? CUR_DESIRED : DESIRED ))
                  echo "##vso[task.logissue type=warning]DR is ACTIVE - rehearsal becomes a rolling update, service stays at $COUNT task(s)"
                else
                  COUNT=$DESIRED
                fi
                echo "action=$ACTION mode=$MODE image=$IMAGE_URI count=$COUNT"
 
                echo "== 1. new task definition revision = current one + new image + SSM env"
                CUR_TD=$(aws ecs describe-services --cluster "$C" --services "$S" --query 'services[0].taskDefinition' --output text)
                [ "$CUR_TD" != None ] || { echo "##vso[task.logissue type=error]Service $C/$S not found - create it first (lab step 4)"; exit 1; }
                aws ecs describe-task-definition --task-definition "$CUR_TD" --query taskDefinition > td-current.json
                # every parameter under config/ and secret/ becomes an env var named after its last path segment
                SECRETS=$( { aws ssm get-parameters-by-path --path "$APP/config" --query 'Parameters[].ARN' --output json;
                             aws ssm get-parameters-by-path --path "$APP/secret" --query 'Parameters[].ARN' --output json; } |
                           jq -s 'add | map({name: (split("/") | last), valueFrom: .}) | sort_by(.name)')
                echo "   env from SSM: $(jq -r 'map(.name) | join(" ")' <<<"$SECRETS")"
                jq -e --arg cn "$(containerName)" '.containerDefinitions | map(.name) | index($cn)' td-current.json >/dev/null \
                  || { echo "##vso[task.logissue type=error]Container '$(containerName)' not in $CUR_TD"; exit 1; }
                jq --arg img "$IMAGE_URI" --arg cn "$(containerName)" --argjson sec "$SECRETS" '
                  del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                      .registeredAt, .registeredBy, .deregisteredAt)
                  | .containerDefinitions |= map(
                      if .name == $cn then
                        .image = $img
                        | .secrets = $sec
                        | .environment = ((.environment // []) | map(select(.name as $n | ($sec | map(.name) | index($n)) | not)))
                      else . end)' td-current.json > td-new.json
                NEW_TD=$(aws ecs register-task-definition --cli-input-json file://td-new.json \
                         --query taskDefinition.taskDefinitionArn --output text)
                echo "   registered $NEW_TD"
 
                echo "== 2. update service -> $COUNT task(s)"
                aws ecs update-service --cluster "$C" --service "$S" --task-definition "$NEW_TD" \
                  --desired-count "$COUNT" --force-new-deployment --query 'service.deployments[0].id' --output text
                aws ecs wait services-stable --cluster "$C" --services "$S" \
                  || { echo "##vso[task.logissue type=error]Service did not become stable"; exit 1; }
                read -r P_TD P_STATE <<<"$(aws ecs describe-services --cluster "$C" --services "$S" \
                  --query "services[0].deployments[?status=='PRIMARY'] | [0].[taskDefinition,rolloutState]" --output text)"
                if [ "$P_TD" != "$NEW_TD" ] || [ "$P_STATE" != COMPLETED ]; then
                  echo "##vso[task.logissue type=error]Rollout not completed (primary=$P_TD state=$P_STATE) - circuit breaker rolled back?"; exit 1
                fi
 
                echo "== 3. health watch ${WATCH_MIN} min (ECS running, ALB targets, HTTP via ALB)"
                TG=$(aws ssm get-parameter --name "$(ssmInfra)/$(appId)/tg-arn" --query Parameter.Value --output text)
                ALB=$(aws ssm get-parameter --name "$(ssmInfra)/alb-dns" --query Parameter.Value --output text)
                URL="http://$ALB$(albPath)"
                END=$(( SECONDS + WATCH_MIN * 60 )); FAILS=0
                while [ $SECONDS -lt $END ]; do
                  RUN=$(aws ecs describe-services --cluster "$C" --services "$S" --query 'services[0].runningCount' --output text)
                  HEALTHY=$(aws elbv2 describe-target-health --target-group-arn "$TG" \
                            --query "length(TargetHealthDescriptions[?TargetHealth.State=='healthy'])" --output text)
                  CODE=$(curl -s -o page.html -w '%{http_code}' --max-time 10 "$URL" || echo 000)
                  echo "   $(date -u +%T)Z running=$RUN/$COUNT healthy=$HEALTHY http=$CODE"
                  if [ "$CODE" = 200 ] && [ "$RUN" -ge "$COUNT" ] && [ "$HEALTHY" -ge "$COUNT" ]; then FAILS=0; else FAILS=$((FAILS+1)); fi
                  [ $FAILS -lt 3 ] || { echo "##vso[task.logissue type=error]3 failed checks in a row"; exit 1; }
                  sleep 15
                done
                grep -oE '(APP_ENV|APP_NAME|DB_PASSWORD|API_KEY|Node.js|Python)[^<]*(</b>[^<]*)?' page.html | sed 's#</b>##' || true
                aws ssm put-parameter --name "$APP/meta/last-good" --type String --overwrite --value "${IMAGE_URI##*:}" >/dev/null
 
                echo "== 4. finish"
                if [ "$ACTION" = activate-dr ]; then
                  aws ssm put-parameter --name "$APP/meta/mode" --type String --overwrite --value active >/dev/null
                  echo "DR ACTIVE: $URL  ($COUNT task(s))"
                elif [ "$MODE" = active ]; then
                  echo "DR stays ACTIVE (rolling update only)"
                else
                  aws ecs update-service --cluster "$C" --service "$S" --desired-count 0 --query 'service.desiredCount' --output text
                  aws ecs wait services-stable --cluster "$C" --services "$S"
                  aws ssm put-parameter --name "$APP/meta/mode" --type String --overwrite --value standby >/dev/null
                  echo "Rehearsal passed - scaled back to 0 (standby). Image ${IMAGE_URI##*:} = last-good"
                fi
            env:
              IMAGE_URI: $(imageUri)
              ACTION: ${{ parameters.action }}
              DESIRED: ${{ parameters.desiredCount }}
              WATCH_MIN: ${{ parameters.healthMinutes }}
 
          - task: AWSShellScript@1
            displayName: On failure - diagnostics (+ back to 0 unless DR is active)
            condition: failed()
            inputs:
              awsCredentials: $(awsConnection)
              regionName: $(awsRegion)
              scriptType: inline
              inlineScript: |
                set -uo pipefail
                C=$(ecsCluster); S=$(ecsService)
                echo "== service events"; aws ecs describe-services --cluster "$C" --services "$S" \
                  --query 'services[0].events[:10].[createdAt,message]' --output text
                echo "== stopped tasks"
                for t in $(aws ecs list-tasks --cluster "$C" --service-name "$S" --desired-status STOPPED --query 'taskArns[:5]' --output text); do
                  aws ecs describe-tasks --cluster "$C" --tasks "$t" \
                    --query 'tasks[0].[stoppedReason, containers[0].reason, containers[0].exitCode]' --output text
                done
                LG=$(aws ssm get-parameter --name "$(ssmInfra)/$(appId)/log-group" --query Parameter.Value --output text)
                echo "== last logs ($LG)"; aws logs tail "$LG" --since 20m | tail -50
                MODE=$(aws ssm get-parameter --name "$(ssmApp)/meta/mode" --query Parameter.Value --output text 2>/dev/null || echo standby)
                if [ "$MODE" != active ]; then
                  aws ecs update-service --cluster "$C" --service "$S" --desired-count 0 >/dev/null && echo "scaled to 0 (standby)"
                else
                  echo "DR is ACTIVE - left as is (circuit breaker keeps the previous revision running)"
                fi
 
# -----------------------------------------------------------------------------
- stage: Deactivate
  displayName: Scale DR to 0
  dependsOn: []
  condition: eq('${{ parameters.action }}', 'deactivate-dr')
  jobs:
  - job: scale0
    steps:
    - checkout: none
    - task: AWSShellScript@1
      displayName: desiredCount = 0, mode = standby
      inputs:
        awsCredentials: $(awsConnection)
        regionName: $(awsRegion)
        scriptType: inline
        inlineScript: |
          set -euo pipefail
          aws ecs update-service --cluster $(ecsCluster) --service $(ecsService) --desired-count 0 --query 'service.desiredCount' --output text
          aws ecs wait services-stable --cluster $(ecsCluster) --services $(ecsService)
          aws ssm put-parameter --name "$(ssmApp)/meta/mode" --type String --overwrite --value standby >/dev/null
          echo "DR for $(appId) is in standby (0 tasks)"
